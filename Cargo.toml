[workspace]
resolver = "2"
members = [
    "app",
    "crates/cap-core",
    "crates/cap-ui",
    "crates/cap-i18n",
    "crates/cap-image",
    "crates/cap-model",
    "crates/cap-video",
    "crates/cap-viewer",
    "crates/cap-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["LookEveryting Contributors"]
repository = "https://github.com/lookeveryting/lookeveryting"

[workspace.dependencies]
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["wgpu"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
