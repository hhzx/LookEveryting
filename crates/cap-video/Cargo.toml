[package]
name = "cap-video"
description = "Video metadata for LookEveryting"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cap-core = { path = "../cap-core" }
thiserror = "2"
egui = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
] }
windows-core = "0.58"

[dev-dependencies]
tempfile = "3"
